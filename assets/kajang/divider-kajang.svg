<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" fill="none">
  <defs>
    <linearGradient id="divKajang" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0" />
      <stop offset="25%" stop-color="#D9B876" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#F3E4BC" stop-opacity="1" />
      <stop offset="75%" stop-color="#D9B876" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Lines with taper -->
  <line x1="25" y1="25" x2="215" y2="25" stroke="url(#divKajang)" stroke-width="1.6" />
  <line x1="285" y1="25" x2="475" y2="25" stroke="url(#divKajang)" stroke-width="1.6" />

  <!-- Center motif: Kajang Sacred Diamond & Weave Geometry -->
  <polygon points="250,11 262,25 250,39 238,25" fill="#1A1512" stroke="#D9B876" stroke-width="1.8"/>
  <polygon points="250,17 256,25 250,33 244,25" fill="#C5A059"/>
  <circle cx="250" cy="25" r="2.2" fill="#FFF8E7"/>

  <!-- Left flank accents -->
  <polygon points="228,21 232,25 228,29 224,25" fill="#D9B876"/>
  <circle cx="216" cy="25" r="2" fill="#C5A059"/>
  <circle cx="204" cy="25" r="1.3" fill="#8F723B"/>

  <!-- Right flank accents -->
  <polygon points="272,21 276,25 272,29 268,25" fill="#D9B876"/>
  <circle cx="284" cy="25" r="2" fill="#C5A059"/>
  <circle cx="296" cy="25" r="1.3" fill="#8F723B"/>
</svg>