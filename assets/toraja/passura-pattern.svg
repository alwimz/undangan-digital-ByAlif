<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <!-- 4 Sacred Toraja Colors: Black (Malotong), Red (Marrung), Yellow/Gold (Meballo), White (Mabusa) -->
  </defs>

  <!-- Base Black Background -->
  <rect width="120" height="120" fill="#140604"/>

  <!-- Outer Diamond Grid (Pa'ulu Karua) -->
  <polygon points="60,0 120,60 60,120 0,60" fill="#881313" stroke="#e5a93b" stroke-width="1.5"/>
  <polygon points="60,12 108,60 60,108 12,60" fill="#180705" stroke="#fdfbf7" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Corner Quadrants (Motif Pa'tedong) -->
  <g fill="#c2410c" stroke="#e5a93b" stroke-width="1">
    <polygon points="0,0 35,0 0,35"/>
    <polygon points="120,0 85,0 120,35"/>
    <polygon points="0,120 35,120 0,85"/>
    <polygon points="120,120 85,120 120,85"/>
  </g>

  <!-- Center Pa'barre Allo (Matahari Suci Toraja) -->
  <g transform="translate(60,60)">
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="18" fill="#e5a93b" stroke="#fdfbf7" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="11" fill="#881313"/>
    <circle cx="0" cy="0" r="5" fill="#fdfbf7"/>

    <!-- 8 Sun Rays (8 Arah Mata Angin Semesta Toraja) -->
    <path d="M0 -28 L4 -20 L-4 -20 Z" fill="#e5a93b"/>
    <path d="M0 28 L4 20 L-4 20 Z" fill="#e5a93b"/>
    <path d="M-28 0 L-20 4 L-20 -4 Z" fill="#e5a93b"/>
    <path d="M28 0 L20 4 L20 -4 Z" fill="#e5a93b"/>

    <!-- Diagonal Ray Dots -->
    <circle cx="-16" cy="-16" r="2.5" fill="#fdfbf7"/>
    <circle cx="16" cy="-16" r="2.5" fill="#fdfbf7"/>
    <circle cx="-16" cy="16" r="2.5" fill="#fdfbf7"/>
    <circle cx="16" cy="16" r="2.5" fill="#fdfbf7"/>
  </g>

  <!-- Corner Dots -->
  <circle cx="6" cy="6" r="2" fill="#e5a93b"/>
  <circle cx="114" cy="6" r="2" fill="#e5a93b"/>
  <circle cx="6" cy="114" r="2" fill="#e5a93b"/>
  <circle cx="114" cy="114" r="2" fill="#e5a93b"/>
</svg>
