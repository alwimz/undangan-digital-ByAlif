<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Toraja Sky Gradient: Deep Twilight Highland Mist -->
    <linearGradient id="torajaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140604"/>
      <stop offset="35%" stop-color="#2a0d08"/>
      <stop offset="65%" stop-color="#4a150c"/>
      <stop offset="85%" stop-color="#2c0c07"/>
      <stop offset="100%" stop-color="#120402"/>
    </linearGradient>

    <!-- Mountain Mist Gradient -->
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c1d11" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#180705" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Warm Toraja Gold Accent -->
    <linearGradient id="goldCarve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#e5a93b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Terracotta Red Wood Finish -->
    <linearGradient id="redWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881313"/>
      <stop offset="50%" stop-color="#550d0d"/>
      <stop offset="100%" stop-color="#220404"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1920" height="1080" fill="url(#torajaSky)"/>

  <!-- MISTIK GUNUNG SESEAN & BUKIT BATU KARST TORAJA -->
  <path d="M 0 450 Q 280 320 550 410 Q 820 490 1150 350 Q 1480 230 1920 380 L 1920 1080 L 0 1080 Z" 
        fill="url(#mistGrad)" opacity="0.65"/>
  <path d="M 0 520 Q 380 430 750 480 Q 1120 540 1450 440 Q 1720 370 1920 460 L 1920 1080 L 0 1080 Z" 
        fill="#1e0705" opacity="0.85"/>

  <!-- SILUET DERETAN TONGKONAN LELUHUR DI KEJAUHAN (BACKGROUND LAYER) -->
  <g opacity="0.25" fill="#0d0302" stroke="#e5a93b" stroke-width="1.2">
    <!-- Jauh Kiri -->
    <path d="M -50 280 C 40 370, 90 385, 150 385 C 210 385, 260 370, 350 280 C 290 355, 230 365, 150 365 C 70 365, 10 355, -50 280 Z"/>
    <rect x="110" y="385" width="80" height="70"/>
    
    <!-- Jauh Kanan -->
    <path d="M 1570 280 C 1660 370, 1710 385, 1770 385 C 1830 385, 1880 370, 1970 280 C 1910 355, 1850 365, 1770 365 C 1690 365, 1630 355, 1570 280 Z"/>
    <rect x="1730" y="385" width="80" height="70"/>
  </g>

  <!-- ========================================================================
       TONGKONAN UTAMA KIRI (TONGKONAN LAYUK - KELUARGA BESAR)
       ======================================================================== -->
  <g id="tongkonan-left" transform="translate(140, 220)">
    <!-- Atap Melengkung Bambu (Longa Prow) -->
    <path d="M 20 80 
             C 160 270, 260 310, 380 310 
             C 500 310, 600 270, 740 80 
             C 630 220, 520 255, 380 255 
             C 240 255, 130 220, 20 80 Z" 
          fill="url(#redWood)" stroke="url(#goldCarve)" stroke-width="3"/>
    
    <!-- Garis Susunan Bambu Atap Khas Toraja -->
    <path d="M 50 120 C 180 260, 270 290, 380 290 C 490 290, 580 260, 710 120" 
          stroke="url(#goldCarve)" stroke-width="1.8" fill="none" opacity="0.75"/>
    <path d="M 80 155 C 200 255, 280 275, 380 275 C 480 275, 560 255, 680 155" 
          stroke="url(#goldCarve)" stroke-width="1.2" stroke-dasharray="8,6" fill="none" opacity="0.6"/>

    <!-- Ujung Haluan Atap Menjulang (Tanduk Ujung Langit) -->
    <polygon points="20,80 0,40 35,70" fill="url(#goldCarve)"/>
    <polygon points="740,80 760,40 725,70" fill="url(#goldCarve)"/>

    <!-- Badan Rumah Tongkonan (Kale Banua) -->
    <rect x="240" y="310" width="280" height="150" fill="#180603" stroke="url(#goldCarve)" stroke-width="2.5"/>
    <rect x="255" y="325" width="250" height="120" fill="url(#redWood)" stroke="#fdfbf7" stroke-width="1"/>

    <!-- Ukiran Pa'barre Allo (Matahari) di Dinding -->
    <g transform="translate(380, 385)">
      <circle cx="0" cy="0" r="28" fill="#180603" stroke="url(#goldCarve)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="16" fill="url(#goldCarve)"/>
      <circle cx="0" cy="0" r="6" fill="#881313"/>
      <!-- Sinar Matahari 8 Penjuru -->
      <line x1="0" y1="-42" x2="0" y2="-28" stroke="url(#goldCarve)" stroke-width="3"/>
      <line x1="0" y1="28" x2="0" y2="42" stroke="url(#goldCarve)" stroke-width="3"/>
      <line x1="-42" y1="0" x2="-28" y2="0" stroke="url(#goldCarve)" stroke-width="3"/>
      <line x1="28" y1="0" x2="42" y2="0" stroke="url(#goldCarve)" stroke-width="3"/>
      <line x1="-28" y1="-28" x2="-20" y2="-20" stroke="url(#goldCarve)" stroke-width="2.5"/>
      <line x1="20" y1="20" x2="28" y2="28" stroke="url(#goldCarve)" stroke-width="2.5"/>
      <line x1="-28" y1="28" x2="-20" y2="20" stroke="url(#goldCarve)" stroke-width="2.5"/>
      <line x1="20" y1="-20" x2="28" y2="-28" stroke="url(#goldCarve)" stroke-width="2.5"/>
    </g>

    <!-- Tiang Utama Tulak Somba & Deretan Tanduk Kerbau (Katik) -->
    <rect x="370" y="255" width="20" height="420" fill="#280a05" stroke="url(#goldCarve)" stroke-width="2"/>
    <!-- Kepala Kerbau Kabongo' Kayu -->
    <polygon points="380,270 398,295 362,295" fill="#120402" stroke="url(#goldCarve)" stroke-width="2"/>
    <path d="M 355,280 C 335,250 365,230 380,240 C 395,230 425,250 405,280" 
          stroke="url(#goldCarve)" stroke-width="4.5" fill="none"/>
    <!-- Susunan Tanduk Kerbau Asli Bertingkat Simbol Kasta Kehormatan Adat -->
    <path d="M 360 330 Q 380 315 400 330" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 361 360 Q 380 345 399 360" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 362 390 Q 380 375 398 390" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 363 420 Q 380 405 397 420" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 364 450 Q 380 435 396 450" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 365 480 Q 380 465 395 480" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 366 510 Q 380 495 394 510" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 367 540 Q 380 525 393 540" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 368 570 Q 380 555 392 570" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>

    <!-- Tiang-Tiang Kolong Rumah (A'riri Panggung) -->
    <g fill="#180603" stroke="url(#goldCarve)" stroke-width="1.5">
      <rect x="260" y="460" width="18" height="280"/>
      <rect x="315" y="460" width="18" height="280"/>
      <rect x="427" y="460" width="18" height="280"/>
      <rect x="482" y="460" width="18" height="280"/>
    </g>
  </g>

  <!-- ========================================================================
       TONGKONAN UTAMA KANAN (TONGKONAN KAPARENGNGESAN)
       ======================================================================== -->
  <g id="tongkonan-right" transform="translate(1040, 220)">
    <path d="M 20 80 
             C 160 270, 260 310, 380 310 
             C 500 310, 600 270, 740 80 
             C 630 220, 520 255, 380 255 
             C 240 255, 130 220, 20 80 Z" 
          fill="url(#redWood)" stroke="url(#goldCarve)" stroke-width="3"/>
    
    <path d="M 50 120 C 180 260, 270 290, 380 290 C 490 290, 580 260, 710 120" 
          stroke="url(#goldCarve)" stroke-width="1.8" fill="none" opacity="0.75"/>
    <path d="M 80 155 C 200 255, 280 275, 380 275 C 480 275, 560 255, 680 155" 
          stroke="url(#goldCarve)" stroke-width="1.2" stroke-dasharray="8,6" fill="none" opacity="0.6"/>

    <polygon points="20,80 0,40 35,70" fill="url(#goldCarve)"/>
    <polygon points="740,80 760,40 725,70" fill="url(#goldCarve)"/>

    <rect x="240" y="310" width="280" height="150" fill="#180603" stroke="url(#goldCarve)" stroke-width="2.5"/>
    <rect x="255" y="325" width="250" height="120" fill="url(#redWood)" stroke="#fdfbf7" stroke-width="1"/>

    <g transform="translate(380, 385)">
      <circle cx="0" cy="0" r="28" fill="#180603" stroke="url(#goldCarve)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="16" fill="url(#goldCarve)"/>
      <circle cx="0" cy="0" r="6" fill="#881313"/>
      <line x1="0" y1="-42" x2="0" y2="-28" stroke="url(#goldCarve)" stroke-width="3"/>
      <line x1="0" y1="28" x2="0" y2="42" stroke="url(#goldCarve)" stroke-width="3"/>
      <line x1="-42" y1="0" x2="-28" y2="0" stroke="url(#goldCarve)" stroke-width="3"/>
      <line x1="28" y1="0" x2="42" y2="0" stroke="url(#goldCarve)" stroke-width="3"/>
    </g>

    <rect x="370" y="255" width="20" height="420" fill="#280a05" stroke="url(#goldCarve)" stroke-width="2"/>
    <polygon points="380,270 398,295 362,295" fill="#120402" stroke="url(#goldCarve)" stroke-width="2"/>
    <path d="M 355,280 C 335,250 365,230 380,240 C 395,230 425,250 405,280" 
          stroke="url(#goldCarve)" stroke-width="4.5" fill="none"/>
    <path d="M 360 330 Q 380 315 400 330" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 361 360 Q 380 345 399 360" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 362 390 Q 380 375 398 390" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 363 420 Q 380 405 397 420" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 364 450 Q 380 435 396 450" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 365 480 Q 380 465 395 480" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>
    <path d="M 366 510 Q 380 495 394 510" stroke="url(#goldCarve)" stroke-width="3.5" fill="none"/>

    <g fill="#180603" stroke="url(#goldCarve)" stroke-width="1.5">
      <rect x="260" y="460" width="18" height="280"/>
      <rect x="315" y="460" width="18" height="280"/>
      <rect x="427" y="460" width="18" height="280"/>
      <rect x="482" y="460" width="18" height="280"/>
    </g>
  </g>

  <!-- ========================================================================
       ALANG SURA' TENGAH (LUMBUNG PADI ADAT KEBANGGAAN KELUARGA BESAR)
       ======================================================================== -->
  <g id="alang-center" transform="translate(680, 420)">
    <!-- Atap Melengkung Alang Lebih Ramping & Rapi -->
    <path d="M 30 50 
             C 130 190, 220 220, 280 220 
             C 340 220, 430 190, 530 50 
             C 450 160, 370 185, 280 185 
             C 190 185, 110 160, 30 50 Z" 
          fill="url(#redWood)" stroke="url(#goldCarve)" stroke-width="2.5"/>

    <!-- Badan Lumbung Kayu Berukir (Sulang) -->
    <rect x="180" y="220" width="200" height="90" fill="#180705" stroke="url(#goldCarve)" stroke-width="2"/>
    <rect x="190" y="230" width="180" height="70" fill="#881313" stroke="#fdfbf7" stroke-width="1"/>

    <!-- 6 Tiang Bulat Halus Batang Palem Khas Alang (Bangkairang) -->
    <g fill="#240a05" stroke="url(#goldCarve)" stroke-width="1.5">
      <rect x="200" y="310" width="14" height="220" rx="3"/>
      <rect x="235" y="310" width="14" height="220" rx="3"/>
      <rect x="270" y="310" width="14" height="220" rx="3"/>
      <rect x="305" y="310" width="14" height="220" rx="3"/>
      <rect x="340" y="310" width="14" height="220" rx="3"/>
    </g>
    <!-- Lantai Tempat Duduk Musyawarah Para Tokoh Adat (Sali) -->
    <rect x="170" y="470" width="220" height="15" rx="3" fill="#180705" stroke="url(#goldCarve)" stroke-width="1.5"/>
  </g>

  <!-- PITA UKIRAN GEOMETRIS PA'SSURA' DI BAGIAN DASAR KAMPUNG TORAJA -->
  <g transform="translate(0, 960)">
    <rect width="1920" height="120" fill="#0d0302"/>
    <line x1="0" y1="0" x2="1920" y2="0" stroke="url(#goldCarve)" stroke-width="3"/>
    <line x1="0" y1="8" x2="1920" y2="8" stroke="#881313" stroke-width="2"/>
  </g>

  <!-- AMBIENT WARMTH & TORCHLIGHT GLOW KAMPUNG ADAT TORAJA -->
  <circle cx="520" cy="620" r="160" fill="#e5a93b" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1420" cy="620" r="160" fill="#e5a93b" opacity="0.08" filter="url(#glow)"/>
  <circle cx="960" cy="680" r="180" fill="#991b1b" opacity="0.1" filter="url(#glow)"/>

  <!-- VIGNETTE OVERLAY LEMBUT (Membuat Konten & Teks Tetap Sangat Jelas Terbaca) -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#140705" stop-opacity="0.35"/>
    <stop offset="60%" stop-color="#140705" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#0c0302" stop-opacity="0.94"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
