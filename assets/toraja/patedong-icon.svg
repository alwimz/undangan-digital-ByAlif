<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <linearGradient id="ptGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#e5a93b"/>
      <stop offset="100%" stop-color="#9a5a0d"/>
    </linearGradient>
    <linearGradient id="ptRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge Backdrop -->
  <circle cx="70" cy="70" r="64" fill="#180705" stroke="url(#ptGold)" stroke-width="2.5"/>
  <circle cx="70" cy="70" r="56" fill="url(#ptRed)" opacity="0.6"/>
  <circle cx="70" cy="70" r="54" fill="none" stroke="#fdfbf7" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- PA'TEDONG (KEPALA & TANDUK KERBAU SAKRAL TORAJA) -->
  <!-- Tanduk Kerbau Besar Melengkung Megah (Buffalo Horns) -->
  <path d="M 30 70 
           C 15 35, 45 15, 70 25 
           C 95 15, 125 35, 110 70 
           C 100 50, 85 40, 70 46 
           C 55 40, 40 50, 30 70 Z" 
        fill="url(#ptGold)" stroke="#fdfbf7" stroke-width="1.2"/>

  <!-- Kepala Segitiga Kerbau (Head Facet) -->
  <polygon points="70,48 88,85 52,85" fill="#180705" stroke="url(#ptGold)" stroke-width="2"/>
  <polygon points="70,55 82,82 58,82" fill="#991b1b"/>

  <!-- Moncong & Hidung Kerbau (Muzzle) -->
  <rect x="62" y="86" width="16" height="18" rx="4" fill="url(#ptGold)"/>
  <circle cx="66" cy="95" r="2" fill="#180705"/>
  <circle cx="74" cy="95" r="2" fill="#180705"/>

  <!-- Mata Kerbau -->
  <circle cx="62" cy="70" r="3" fill="url(#ptGold)"/>
  <circle cx="78" cy="70" r="3" fill="url(#ptGold)"/>
  <circle cx="62" cy="70" r="1.2" fill="#fdfbf7"/>
  <circle cx="78" cy="70" r="1.2" fill="#fdfbf7"/>

  <!-- Ornamen Ukiran Bawah (Pa'ulu Karua) -->
  <circle cx="70" cy="116" r="4" fill="url(#ptGold)"/>
  <line x1="45" y1="116" x2="62" y2="116" stroke="url(#ptGold)" stroke-width="2"/>
  <line x1="78" y1="116" x2="95" y2="116" stroke="url(#ptGold)" stroke-width="2"/>
</svg>
