<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" fill="none">
  <defs>
    <linearGradient id="tDivGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5a93b" stop-opacity="0"/>
      <stop offset="25%" stop-color="#fde68a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e5a93b" stop-opacity="1"/>
      <stop offset="75%" stop-color="#fde68a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e5a93b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left & Right Filigree Lines -->
  <line x1="20" y1="25" x2="210" y2="25" stroke="url(#tDivGold)" stroke-width="1.8"/>
  <line x1="290" y1="25" x2="480" y2="25" stroke="url(#tDivGold)" stroke-width="1.8"/>

  <!-- Center Sun Motif Pa'barre Allo -->
  <circle cx="250" cy="25" r="14" fill="#180705" stroke="#e5a93b" stroke-width="2"/>
  <circle cx="250" cy="25" r="8" fill="#991b1b"/>
  <circle cx="250" cy="25" r="3.5" fill="#fde68a"/>

  <!-- Mini Sun Rays -->
  <line x1="250" y1="5" x2="250" y2="9" stroke="#e5a93b" stroke-width="2"/>
  <line x1="250" y1="41" x2="250" y2="45" stroke="#e5a93b" stroke-width="2"/>
  <line x1="230" y1="25" x2="234" y2="25" stroke="#e5a93b" stroke-width="2"/>
  <line x1="266" y1="25" x2="270" y2="25" stroke="#e5a93b" stroke-width="2"/>

  <!-- Left/Right Diamond Flanks (Pa'doti Langi') -->
  <polygon points="220,25 225,20 230,25 225,30" fill="#e5a93b"/>
  <polygon points="270,25 275,20 280,25 275,30" fill="#e5a93b"/>
</svg>
