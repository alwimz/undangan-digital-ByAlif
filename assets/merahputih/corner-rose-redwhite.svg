<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Red Rose Gradient -->
    <radialGradient id="redRoseGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="30%" stop-color="#DC2626" />
      <stop offset="70%" stop-color="#990011" />
      <stop offset="100%" stop-color="#5B000B" />
    </radialGradient>
    <radialGradient id="redPetalDeep" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="65%" stop-color="#880010" />
      <stop offset="100%" stop-color="#400007" />
    </radialGradient>

    <!-- White Rose Gradient -->
    <radialGradient id="whiteRoseGlow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF5F5" />
      <stop offset="80%" stop-color="#FED7DC" />
      <stop offset="100%" stop-color="#E2A6B0" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldVine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#E5C378" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6510" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CA982" />
      <stop offset="60%" stop-color="#3B6E47" />
      <stop offset="100%" stop-color="#1E3E26" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5B000B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ================= L-CORNER ORNAMENTAL FRAMING ================= -->
  <!-- Outer Gold Corner Border -->
  <path d="M6,154 L6,38 Q6,6 38,6 L154,6" stroke="url(#goldVine)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Inner Dashed Elegance Line -->
  <path d="M14,154 L14,42 Q14,14 42,14 L154,14" stroke="url(#goldVine)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.85" fill="none" />

  <!-- Corner Filigree Swirls -->
  <path d="M14,68 C28,58 34,38 54,34 C70,30 82,14 74,14" stroke="url(#goldVine)" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <path d="M68,14 C58,28 38,34 34,54 C30,70 14,82 14,74" stroke="url(#goldVine)" stroke-width="1.6" stroke-linecap="round" fill="none" />

  <!-- Tiny Gold Dew Beads -->
  <circle cx="6" cy="6" r="3.5" fill="url(#goldVine)" />
  <circle cx="150" cy="6" r="2.5" fill="url(#goldVine)" />
  <circle cx="6" cy="150" r="2.5" fill="url(#goldVine)" />
  <circle cx="28" cy="28" r="2" fill="url(#goldVine)" />

  <!-- ================= BOTANICAL FOLIAGE (LEAVES) ================= -->
  <!-- Leaves pointing top-right -->
  <path d="M52,22 C64,14 76,18 70,28 C62,34 54,28 52,22 Z" fill="url(#leafGreen)" stroke="url(#goldVine)" stroke-width="0.75" />
  <path d="M54,24 Q62,24 67,26" stroke="#9AD1A6" stroke-width="0.6" stroke-linecap="round" />

  <!-- Leaves pointing bottom-left -->
  <path d="M22,52 C14,64 18,76 28,70 C34,62 28,54 22,52 Z" fill="url(#leafGreen)" stroke="url(#goldVine)" stroke-width="0.75" />
  <path d="M24,54 Q24,62 26,67" stroke="#9AD1A6" stroke-width="0.6" stroke-linecap="round" />

  <!-- Accent Gold Leaf Pair -->
  <path d="M66,32 C74,28 80,34 76,40 C70,42 66,38 66,32 Z" fill="url(#goldVine)" opacity="0.85" />
  <path d="M32,66 C28,74 34,80 40,76 C42,70 38,66 32,66 Z" fill="url(#goldVine)" opacity="0.85" />

  <!-- ================= WHITE ROSE (SECONDARY BLOSSOM) ================= -->
  <g transform="translate(68, 54)" filter="url(#softGlow)">
    <!-- Base Petals -->
    <circle cx="0" cy="0" r="14" fill="url(#whiteRoseGlow)" stroke="#E2A6B0" stroke-width="0.8" />
    <path d="M-12,-4 C-10,-12 0,-15 10,-10 C16,-4 14,8 6,12 C-4,14 -12,8 -12,-4 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M-8,-6 C-4,-12 6,-10 10,-4 C12,4 6,8 -2,7 C-7,6 -10,0 -8,-6 Z" fill="url(#whiteRoseGlow)" />
    <!-- Rose Core -->
    <path d="M-4,-2 C-2,-6 4,-5 5,-1 C6,3 2,5 -1,4 C-4,3 -5,0 -4,-2 Z" fill="#F87171" opacity="0.7" />
    <circle cx="0" cy="0" r="2.5" fill="#DC2626" />
  </g>

  <!-- ================= RED VELVET ROSE (MAIN BLOSSOM) ================= -->
  <g transform="translate(42, 42)" filter="url(#softGlow)">
    <!-- Outer Petal Rings -->
    <path d="M-22,-6 C-24,-18 -10,-24 4,-20 C18,-18 26,-6 22,10 C18,22 4,26 -12,20 C-22,14 -20,2 -22,-6 Z" fill="url(#redPetalDeep)" />
    
    <path d="M-18,-12 C-8,-22 12,-18 18,-6 C22,6 14,18 2,18 C-10,18 -18,6 -18,-12 Z" fill="url(#redRoseGlow)" stroke="url(#goldVine)" stroke-width="0.6" />
    
    <!-- Middle Swirl Petals -->
    <path d="M-12,-8 C-4,-16 10,-12 12,-2 C14,8 4,12 -6,10 C-14,6 -14,-2 -12,-8 Z" fill="url(#redPetalDeep)" />
    <path d="M-8,-4 C-2,-10 8,-8 8,0 C8,8 0,8 -6,6 C-9,4 -9,-1 -8,-4 Z" fill="url(#redRoseGlow)" />
    
    <!-- Inner Rose Bud Core -->
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#FFE4E6" stroke="#DC2626" stroke-width="0.75" />
    <circle cx="0.5" cy="-0.5" r="2" fill="#990011" />
    <circle cx="0" cy="0" r="1" fill="#FFFDF2" />
  </g>

  <!-- ================= RED ROSEBUD ACCENTS ================= -->
  <!-- Top Bud -->
  <g transform="translate(86, 26)">
    <path d="M0,0 C6,-6 14,-2 10,8 C6,10 0,6 0,0 Z" fill="url(#redRoseGlow)" stroke="url(#goldVine)" stroke-width="0.6" />
    <path d="M-2,2 C-1,6 3,7 5,5" stroke="#3B6E47" stroke-width="1.2" stroke-linecap="round" />
  </g>
  <!-- Left Bud -->
  <g transform="translate(26, 86)">
    <path d="M0,0 C-6,6 -2,14 8,10 C10,6 6,0 0,0 Z" fill="url(#redRoseGlow)" stroke="url(#goldVine)" stroke-width="0.6" />
    <path d="M2,-2 C6,-1 7,3 5,5" stroke="#3B6E47" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
