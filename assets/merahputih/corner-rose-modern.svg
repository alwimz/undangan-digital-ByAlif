<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Modern Metallic Gold Gradient -->
    <linearGradient id="modernGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="30%" stop-color="#E5C378" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6510" />
    </linearGradient>

    <!-- Deep Crimson & Velvet Rose Gradient -->
    <radialGradient id="velvetRose" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="25%" stop-color="#DC2626" />
      <stop offset="65%" stop-color="#990011" />
      <stop offset="95%" stop-color="#550009" />
    </radialGradient>
    <radialGradient id="petalShadow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#C41E3A" />
      <stop offset="70%" stop-color="#80000C" />
      <stop offset="100%" stop-color="#3D0005" />
    </radialGradient>

    <!-- Translucent White & Blush Rose Gradient -->
    <radialGradient id="blushWhiteRose" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FFF5F6" />
      <stop offset="80%" stop-color="#FED7DC" />
      <stop offset="100%" stop-color="#E2A6B0" />
    </radialGradient>

    <!-- Modern Sage & Eucalyptus Leaf Gradient -->
    <linearGradient id="sageLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BC0A5" />
      <stop offset="50%" stop-color="#5B8766" />
      <stop offset="100%" stop-color="#2D5237" />
    </linearGradient>
    <linearGradient id="oliveLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8CCA6" />
      <stop offset="60%" stop-color="#738A5E" />
      <stop offset="100%" stop-color="#3F522E" />
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="modernGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4A0007" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ================= SLEEK MINIMALIST GOLD CORNER LINES ================= -->
  <!-- Outer Ultra-Thin Hairline -->
  <path d="M4,152 L4,32 Q4,4 32,4 L152,4" stroke="url(#modernGold)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />
  <!-- Inner Parallel Fine Line -->
  <path d="M10,152 L10,34 Q10,10 34,10 L152,10" stroke="url(#modernGold)" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.75" fill="none" />
  
  <!-- Subtle Corner Diamond Notch -->
  <polygon points="4,4 8,4 8,8 4,8" fill="url(#modernGold)" />
  <circle cx="20" cy="20" r="1.5" fill="url(#modernGold)" />

  <!-- Flowing Gold Accent Tendrils -->
  <path d="M10,88 C18,72 26,52 46,44 C66,36 94,22 108,10" stroke="url(#modernGold)" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M88,10 C72,18 52,26 44,46 C36,66 22,94 10,108" stroke="url(#modernGold)" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Tiny Gold Stamen Beads / Gypsophila -->
  <circle cx="116" cy="14" r="2" fill="url(#modernGold)" />
  <circle cx="128" cy="8" r="1.5" fill="url(#modernGold)" />
  <circle cx="14" cy="116" r="2" fill="url(#modernGold)" />
  <circle cx="8" cy="128" r="1.5" fill="url(#modernGold)" />
  <circle cx="36" cy="36" r="2" fill="url(#modernGold)" />

  <!-- ================= MODERN EUCALYPTUS & OLIVE LEAF SPRAYS ================= -->
  <!-- Top Leaf Spray -->
  <path d="M58,26 C72,14 86,18 80,32 C72,40 60,34 58,26 Z" fill="url(#sageLeaf)" opacity="0.92" />
  <path d="M60,28 Q72,28 77,30" stroke="url(#modernGold)" stroke-width="0.75" stroke-linecap="round" />

  <path d="M78,16 C90,8 100,14 96,24 C90,30 82,24 78,16 Z" fill="url(#oliveLeaf)" opacity="0.88" />
  <path d="M80,18 Q88,18 93,22" stroke="url(#modernGold)" stroke-width="0.6" stroke-linecap="round" />

  <!-- Left Leaf Spray -->
  <path d="M26,58 C14,72 18,86 32,80 C40,72 34,60 26,58 Z" fill="url(#sageLeaf)" opacity="0.92" />
  <path d="M28,60 Q28,72 30,77" stroke="url(#modernGold)" stroke-width="0.75" stroke-linecap="round" />

  <path d="M16,78 C8,90 14,100 24,96 C30,90 24,82 16,78 Z" fill="url(#oliveLeaf)" opacity="0.88" />
  <path d="M18,80 Q18,88 22,93" stroke="url(#modernGold)" stroke-width="0.6" stroke-linecap="round" />

  <!-- Gold Leaf Accent -->
  <path d="M70,40 C82,34 88,44 82,52 C74,54 68,48 70,40 Z" fill="url(#modernGold)" opacity="0.8" />
  <path d="M40,70 C34,82 44,88 52,82 C54,74 48,68 40,70 Z" fill="url(#modernGold)" opacity="0.8" />

  <!-- ================= SOFT WHITE/BLUSH GARDEN ROSE (SECONDARY) ================= -->
  <g transform="translate(74, 58)" filter="url(#modernGlow)">
    <!-- Soft Petal Layers -->
    <path d="M-16,-6 C-14,-18 2,-20 14,-14 C22,-6 18,12 8,16 C-4,20 -16,10 -16,-6 Z" fill="url(#blushWhiteRose)" opacity="0.95" />
    <path d="M-12,-10 C-4,-18 10,-14 12,-4 C14,8 4,14 -4,12 C-12,8 -14,-2 -12,-10 Z" fill="#FFFFFF" stroke="#FED7DC" stroke-width="0.7" />
    
    <!-- Rose Cup Center -->
    <ellipse cx="0" cy="0" rx="7" ry="5.5" fill="url(#blushWhiteRose)" />
    <path d="M-4,-2 C-2,-6 4,-5 5,-1 C6,4 2,6 -1,5 C-4,4 -5,1 -4,-2 Z" fill="#F43F5E" opacity="0.65" />
    <circle cx="0.5" cy="0" r="2" fill="#E11D48" />
  </g>

  <!-- ================= MODERN VELVET CRIMSON ENGLISH ROSE (PRIMARY) ================= -->
  <g transform="translate(45, 45)" filter="url(#modernGlow)">
    <!-- Outer Deep Shadow Petals -->
    <path d="M-26,-8 C-28,-22 -12,-30 4,-26 C20,-22 30,-8 26,12 C20,28 4,32 -14,26 C-26,18 -24,2 -26,-8 Z" fill="url(#petalShadow)" />

    <!-- Main Blooming Velvet Petals with Fine Gold Edging -->
    <path d="M-22,-14 C-10,-26 14,-22 22,-8 C28,6 18,22 4,22 C-12,22 -22,6 -22,-14 Z" fill="url(#velvetRose)" stroke="url(#modernGold)" stroke-width="0.6" />

    <!-- Interior Curled Petal Ruffles -->
    <path d="M-15,-10 C-6,-18 10,-14 14,-2 C16,10 6,15 -6,13 C-15,9 -16,-1 -15,-10 Z" fill="url(#petalShadow)" />
    <path d="M-10,-6 C-3,-13 8,-10 9,0 C10,9 1,11 -6,9 C-10,7 -11,0 -10,-6 Z" fill="url(#velvetRose)" />

    <!-- Core Swirl -->
    <ellipse cx="0" cy="0" rx="5.5" ry="4.5" fill="#FFE4E6" stroke="#E11D48" stroke-width="0.8" />
    <path d="M-2,-2 C0,-4 3,-3 3,0 C3,3 0,3 -2,1 Z" fill="#880010" />
    <circle cx="0" cy="0" r="1.2" fill="#FFFDF2" />
  </g>

  <!-- ================= DELICATE MODERN ROSEBUD ACCENTS ================= -->
  <!-- Top-Right Slender Rosebud -->
  <g transform="translate(100, 24)">
    <path d="M-2,2 C-2,10 4,14 8,8" stroke="#5B8766" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M0,0 C6,-8 16,-4 12,8 C8,10 0,6 0,0 Z" fill="url(#velvetRose)" stroke="url(#modernGold)" stroke-width="0.6" />
    <circle cx="6" cy="1" r="1" fill="#FFFDF2" opacity="0.8" />
  </g>

  <!-- Bottom-Left Slender Rosebud -->
  <g transform="translate(24, 100)">
    <path d="M2,-2 C10,-2 14,4 8,8" stroke="#5B8766" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M0,0 C-8,6 -4,16 8,12 C10,8 6,0 0,0 Z" fill="url(#velvetRose)" stroke="url(#modernGold)" stroke-width="0.6" />
    <circle cx="1" cy="6" r="1" fill="#FFFDF2" opacity="0.8" />
  </g>
</svg>
