<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldCorner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#BF953F" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  <!-- Outer Corner Frame -->
  <path d="M 5,95 L 5,20 Q 5,5 20,5 L 95,5" stroke="url(#goldCorner)" stroke-width="2.5" fill="none"/>
  <path d="M 12,85 L 12,24 Q 12,12 24,12 L 85,12" stroke="url(#goldCorner)" stroke-width="1.2" stroke-dasharray="3,2" fill="none"/>

  <!-- Bugis Filigree / Sulur Ukiran Emas Khas -->
  <path d="M 5,5 Q 35,10 40,40 Q 10,35 5,5 Z" fill="url(#goldCorner)" opacity="0.85"/>
  <circle cx="20" cy="20" r="4.5" fill="url(#goldCorner)"/>
  <circle cx="20" cy="20" r="2" fill="#580812"/>

  <!-- Branching flourish -->
  <path d="M 22,22 C 30,30 35,45 32,55 C 30,45 20,35 15,30" stroke="url(#goldCorner)" stroke-width="1.8" fill="none"/>
  <path d="M 22,22 C 30,30 45,35 55,32 C 45,30 35,20 30,15" stroke="url(#goldCorner)" stroke-width="1.8" fill="none"/>
  
  <circle cx="32" cy="55" r="2.5" fill="url(#goldCorner)"/>
  <circle cx="55" cy="32" r="2.5" fill="url(#goldCorner)"/>
  <circle cx="5" cy="5" r="4" fill="url(#goldCorner)"/>
</svg>
