<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Seamless Javanese Batik Kawung / Truntum Motif -->
    <pattern id="batikTile" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Center 4-petal Kawung ellipse -->
      <ellipse cx="30" cy="15" rx="8" ry="14" stroke="#E5C579" stroke-width="0.8" stroke-opacity="0.22" fill="none" />
      <ellipse cx="30" cy="45" rx="8" ry="14" stroke="#E5C579" stroke-width="0.8" stroke-opacity="0.22" fill="none" />
      <ellipse cx="15" cy="30" rx="14" ry="8" stroke="#E5C579" stroke-width="0.8" stroke-opacity="0.22" fill="none" />
      <ellipse cx="45" cy="30" rx="14" ry="8" stroke="#E5C579" stroke-width="0.8" stroke-opacity="0.22" fill="none" />
      
      <!-- Center Truntum star / cross -->
      <circle cx="30" cy="30" r="2.5" fill="#E5C579" fill-opacity="0.3" />
      <circle cx="30" cy="30" r="4.5" stroke="#E5C579" stroke-width="0.6" stroke-opacity="0.2" fill="none" />

      <!-- Corner intersections -->
      <circle cx="0" cy="0" r="2" fill="#E5C579" fill-opacity="0.25" />
      <circle cx="60" cy="0" r="2" fill="#E5C579" fill-opacity="0.25" />
      <circle cx="0" cy="60" r="2" fill="#E5C579" fill-opacity="0.25" />
      <circle cx="60" cy="60" r="2" fill="#E5C579" fill-opacity="0.25" />

      <!-- Diamond connecting accents -->
      <polygon points="30,0 33,3 30,6 27,3" fill="#E5C579" fill-opacity="0.18" />
      <polygon points="30,54 33,57 30,60 27,57" fill="#E5C579" fill-opacity="0.18" />
      <polygon points="0,30 3,33 6,30 3,27" fill="#E5C579" fill-opacity="0.18" />
      <polygon points="54,30 57,33 60,30 57,27" fill="#E5C579" fill-opacity="0.18" />
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#batikTile)" />
</svg>