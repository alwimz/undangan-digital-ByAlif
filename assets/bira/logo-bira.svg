<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldBira" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F6E05E" />
      <stop offset="100%" stop-color="#B38728" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Circular Elegant Outer Ring -->
  <circle cx="100" cy="100" r="92" stroke="url(#goldBira)" stroke-width="2" stroke-dasharray="6 4" opacity="0.65" />
  <circle cx="100" cy="100" r="86" stroke="url(#goldBira)" stroke-width="1.2" opacity="0.9" />

  <!-- Stylized Phinisi Boat Hull (Perahu Pinisi Bulukumba) -->
  <path d="M 45 138 C 70 148, 130 148, 155 138 C 160 136, 158 131, 152 131 L 48 131 C 42 131, 40 136, 45 138 Z" fill="url(#goldBira)" />

  <!-- Modern Waves under Hull -->
  <path d="M 35 147 C 50 143, 65 151, 80 147 C 95 143, 105 151, 120 147 C 135 143, 150 151, 165 147" stroke="url(#oceanGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 45 154 C 60 151, 75 157, 90 154 C 105 151, 120 157, 135 154 C 145 152, 155 156, 160 154" stroke="url(#goldBira)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Main Mast & Bowsprit -->
  <line x1="90" y1="52" x2="90" y2="131" stroke="url(#goldBira)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="120" y1="62" x2="120" y2="131" stroke="url(#goldBira)" stroke-width="2" stroke-linecap="round" />
  <line x1="90" y1="110" x2="168" y2="126" stroke="url(#goldBira)" stroke-width="2" stroke-linecap="round" />

  <!-- Sails (Layar Pinisi Megah) -->
  <!-- Main Sail 1 -->
  <path d="M 90 56 C 82 75, 78 100, 68 116 L 90 114 Z" fill="url(#goldBira)" opacity="0.95" />
  <!-- Main Sail 2 -->
  <path d="M 120 66 C 112 85, 108 106, 98 120 L 120 118 Z" fill="url(#goldBira)" opacity="0.85" />
  <!-- Jib / Front Sail 3 -->
  <path d="M 90 70 L 138 122 L 90 120 Z" fill="url(#goldBira)" opacity="0.7" />

  <!-- North Star / Romantic Star Sparkle -->
  <g transform="translate(100, 36) scale(0.9)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="url(#goldBira)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFF" />
  </g>

  <!-- Typography Monogram (A & W) -->
  <text x="100" y="178" text-anchor="middle" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#goldBira)" letter-spacing="3">TANJUNG BIRA</text>
</svg>