<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" fill="none">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F" stop-opacity="0" />
      <stop offset="30%" stop-color="#FCF6BA" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#BF953F" stop-opacity="1" />
      <stop offset="70%" stop-color="#FCF6BA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#BF953F" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Center Diamond & Accents -->
  <line x1="20" y1="25" x2="220" y2="25" stroke="url(#divGold)" stroke-width="1.5" />
  <line x1="280" y1="25" x2="480" y2="25" stroke="url(#divGold)" stroke-width="1.5" />

  <!-- Center motif: Bugis rosette -->
  <polygon points="250,13 260,25 250,37 240,25" fill="#BF953F" stroke="#FCF6BA" stroke-width="1.5"/>
  <circle cx="250" cy="25" r="3" fill="#FFEAA7"/>

  <!-- Left flank -->
  <circle cx="230" cy="25" r="2.5" fill="#BF953F"/>
  <circle cx="215" cy="25" r="1.5" fill="#BF953F"/>

  <!-- Right flank -->
  <circle cx="270" cy="25" r="2.5" fill="#BF953F"/>
  <circle cx="285" cy="25" r="1.5" fill="#BF953F"/>
</svg>
