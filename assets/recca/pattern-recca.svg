<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" fill="none">
  <!-- Woven Recca Lontar Matrix -->
  <!-- Dark woven strands -->
  <path d="M0,30 L30,0 L60,30 L30,60 Z" fill="#0C0E12" stroke="#1D222A" stroke-width="1.2" />
  <path d="M30,30 L60,0 L90,30 L60,60 Z" fill="#0E1116" stroke="#1D222A" stroke-width="1.2" />
  <path d="M-30,30 L0,0 L30,30 L0,60 Z" fill="#0E1116" stroke="#1D222A" stroke-width="1.2" />

  <!-- Diagonal fiber striations -->
  <line x1="5" y1="25" x2="25" y2="5" stroke="#1F252E" stroke-width="0.8" />
  <line x1="15" y1="35" x2="35" y2="15" stroke="#1F252E" stroke-width="0.8" />
  <line x1="25" y1="45" x2="45" y2="25" stroke="#1F252E" stroke-width="0.8" />
  <line x1="35" y1="55" x2="55" y2="35" stroke="#1F252E" stroke-width="0.8" />

  <!-- Interlocking Gold Thread Highlights (Benang Emas Pamiring) -->
  <polygon points="30,0 34,4 30,8 26,4" fill="#C59B27" opacity="0.4" />
  <polygon points="60,30 64,34 60,38 56,34" fill="#C59B27" opacity="0.4" />
  <polygon points="0,30 4,34 0,38 -4,34" fill="#C59B27" opacity="0.4" />
  <polygon points="30,60 34,64 30,68 26,64" fill="#C59B27" opacity="0.4" />

  <!-- Center subtle diamond node -->
  <circle cx="30" cy="30" r="1.2" fill="#E5B842" opacity="0.3" />
</svg>
