<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <linearGradient id="floralGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="35%" stop-color="#FCE588" />
      <stop offset="70%" stop-color="#D4A028" />
      <stop offset="100%" stop-color="#8C6510" />
    </linearGradient>
    <linearGradient id="petalWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFF5E0" />
      <stop offset="100%" stop-color="#F5D061" />
    </linearGradient>
  </defs>

  <!-- Outer L-Border with Filigree Vines -->
  <path d="M6,134 L6,36 Q6,6 36,6 L134,6" stroke="url(#floralGold)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M14,134 L14,40 Q14,14 40,14 L134,14" stroke="url(#floralGold)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.85" fill="none" />

  <!-- Vine Flourishes (Sulur Ukiran Bugis) -->
  <path d="M14,60 C26,50 32,32 50,30 C64,28 72,14 68,14" stroke="url(#floralGold)" stroke-width="1.6" fill="none" />
  <path d="M60,14 C50,26 32,32 30,50 C28,64 14,72 14,68" stroke="url(#floralGold)" stroke-width="1.6" fill="none" />
  
  <!-- Golden Leaves -->
  <path d="M38,24 C45,18 52,22 48,28 C42,32 36,28 38,24 Z" fill="url(#floralGold)" opacity="0.9" />
  <path d="M24,38 C18,45 22,52 28,48 C32,42 28,36 24,38 Z" fill="url(#floralGold)" opacity="0.9" />
  <path d="M62,18 C70,14 74,22 70,26 C64,28 60,22 62,18 Z" fill="url(#floralGold)" opacity="0.8" />
  <path d="M18,62 C14,70 22,74 26,70 C28,64 22,60 18,62 Z" fill="url(#floralGold)" opacity="0.8" />

  <!-- Blooming Jasmine Flower (Bunga Melati Adat Bugis) at Corner Vertex -->
  <g transform="translate(30, 30)">
    <!-- 8 Petals Jasmine Blossom -->
    <ellipse cx="0" cy="-12" rx="4.5" ry="9" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.8" />
    <ellipse cx="0" cy="12" rx="4.5" ry="9" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.8" />
    <ellipse cx="-12" cy="0" rx="9" ry="4.5" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.8" />
    <ellipse cx="12" cy="0" rx="9" ry="4.5" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.8" />
    
    <g transform="rotate(45)">
      <ellipse cx="0" cy="-10" rx="3.5" ry="7.5" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.7" />
      <ellipse cx="0" cy="10" rx="3.5" ry="7.5" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.7" />
      <ellipse cx="-10" cy="0" rx="7.5" ry="3.5" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.7" />
      <ellipse cx="10" cy="0" rx="7.5" ry="3.5" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.7" />
    </g>

    <!-- Flower Center Stamen -->
    <circle cx="0" cy="0" r="4.5" fill="#F5D061" stroke="#8C6510" stroke-width="1" />
    <circle cx="0" cy="0" r="2" fill="#FFFDF2" />
  </g>

  <!-- Secondary Smaller Jasmine Blossoms -->
  <g transform="translate(85, 14)">
    <circle cx="0" cy="0" r="7" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.8" />
    <circle cx="0" cy="0" r="2.5" fill="#F5D061" />
  </g>
  <g transform="translate(14, 85)">
    <circle cx="0" cy="0" r="7" fill="url(#petalWhite)" stroke="#D4A028" stroke-width="0.8" />
    <circle cx="0" cy="0" r="2.5" fill="#F5D061" />
  </g>

  <!-- Bugis Sulapa Eppa Diamond Accent at Tip -->
  <g transform="translate(12, 12)">
    <polygon points="0,-6 6,0 0,6 -6,0" stroke="url(#floralGold)" stroke-width="1.4" fill="#0C0E12" />
    <circle cx="0" cy="0" r="1.8" fill="#FFFDF2" />
  </g>
</svg>
