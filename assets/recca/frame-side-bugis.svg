<svg xmlns="http://www.w3.org/2000/svg" width="30" height="120" viewBox="0 0 30 120" fill="none">
  <defs>
    <linearGradient id="sideG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A028" />
      <stop offset="50%" stop-color="#FFFDF2" />
      <stop offset="100%" stop-color="#8C6510" />
    </linearGradient>
  </defs>

  <!-- Vertical Border Guide Lines -->
  <line x1="5" y1="0" x2="5" y2="120" stroke="url(#sideG)" stroke-width="1.2" opacity="0.6" />
  <line x1="25" y1="0" x2="25" y2="120" stroke="url(#sideG)" stroke-width="1.2" opacity="0.6" />
  <line x1="15" y1="0" x2="15" y2="120" stroke="url(#sideG)" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Repeating Sulapa Eppa Diamond Chain -->
  <!-- Node 1 -->
  <polygon points="15,10 22,20 15,30 8,20" stroke="url(#sideG)" stroke-width="1.2" fill="#0C0E12" />
  <circle cx="15" cy="20" r="2" fill="#FFFDF2" />

  <!-- Node 2 -->
  <polygon points="15,50 22,60 15,70 8,60" stroke="url(#sideG)" stroke-width="1.2" fill="#0C0E12" />
  <circle cx="15" cy="60" r="2" fill="#FFFDF2" />

  <!-- Node 3 -->
  <polygon points="15,90 22,100 15,110 8,100" stroke="url(#sideG)" stroke-width="1.2" fill="#0C0E12" />
  <circle cx="15" cy="100" r="2" fill="#FFFDF2" />

  <!-- Interlocking Lontar Cross Ties -->
  <line x1="8" y1="38" x2="22" y2="42" stroke="url(#sideG)" stroke-width="0.8" opacity="0.5" />
  <line x1="22" y1="38" x2="8" y2="42" stroke="url(#sideG)" stroke-width="0.8" opacity="0.5" />
  
  <line x1="8" y1="78" x2="22" y2="82" stroke="url(#sideG)" stroke-width="0.8" opacity="0.5" />
  <line x1="22" y1="78" x2="8" y2="82" stroke="url(#sideG)" stroke-width="0.8" opacity="0.5" />
</svg>
