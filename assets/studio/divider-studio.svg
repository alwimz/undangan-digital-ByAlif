<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" fill="none">
  <!-- Modern Studio Divider with Aperture Star -->
  <line x1="10" y1="20" x2="160" y2="20" stroke="url(#lineGradLeft)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="240" y1="20" x2="390" y2="20" stroke="url(#lineGradRight)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Outer diamonds -->
  <rect x="168" y="17" width="6" height="6" transform="rotate(45 171 20)" fill="#FDE68A"/>
  <rect x="226" y="17" width="6" height="6" transform="rotate(45 229 20)" fill="#FDE68A"/>
  
  <!-- Center Aperture Star -->
  <circle cx="200" cy="20" r="14" stroke="#FBBF24" stroke-width="1.8" fill="#13161F"/>
  <circle cx="200" cy="20" r="10" stroke="#FDE68A" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="200" cy="20" r="3.5" fill="#FBBF24"/>
  <polygon points="200,8 203,17 212,20 203,23 200,32 197,23 188,20 197,17" fill="#FBBF24" opacity="0.6"/>

  <defs>
    <linearGradient id="lineGradLeft" x1="10" y1="20" x2="160" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="lineGradRight" x1="240" y1="20" x2="390" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.4" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
