<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" fill="none">
  <!-- Modern Editorial Studio Logo: "THE STUDIO • BUGIS HERITAGE" -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Decorative Ring -->
  <circle cx="120" cy="38" r="30" stroke="url(#goldGrad)" stroke-width="1.8" fill="none"/>
  <circle cx="120" cy="38" r="26" stroke="#FDE68A" stroke-width="0.8" stroke-dasharray="3 2" fill="none" opacity="0.7"/>
  
  <!-- Studio Lens Aperture Petals in Center -->
  <circle cx="120" cy="38" r="8" fill="url(#goldGrad)" opacity="0.3"/>
  <path d="M120 18 L123 32 L120 38" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M137 28 L127 38 L120 38" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M137 48 L123 44 L120 38" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M120 58 L117 44 L120 38" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M103 48 L113 38 L120 38" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M103 28 L117 32 L120 38" stroke="url(#goldGrad)" stroke-width="1.2"/>
  
  <!-- Center Monogram 'A & W' -->
  <text x="120" y="42" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AW</text>

  <!-- Studio Typography -->
  <text x="120" y="78" font-family="'Cinzel', 'Playfair Display', serif" font-size="10" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">THE WEDDING STUDIO</text>
  <text x="120" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#E5E7EB" text-anchor="middle" letter-spacing="2.5">ADAT BUGIS HERITAGE</text>
</svg>
