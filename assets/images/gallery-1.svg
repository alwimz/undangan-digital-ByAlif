<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a040b" />
      <stop offset="50%" stop-color="#800a16" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <rect width="500" height="600" fill="url(#skyGrad1)"/>
  <circle cx="250" cy="220" r="100" fill="url(#goldSun)" opacity="0.85"/>
  <!-- Siluet Saoraja / Balla Lompoa Rumah Adat Bugis -->
  <polygon points="250,110 370,190 130,190" fill="#200205"/>
  <polygon points="250,90 280,110 220,110" fill="#D4AF37"/>
  <rect x="150" y="190" width="200" height="90" fill="#2b0409"/>
  <!-- Tiang-Tiang Saoraja (Rumah Panggung) -->
  <g fill="#180104">
    <rect x="160" y="280" width="12" height="180"/>
    <rect x="200" y="280" width="12" height="180"/>
    <rect x="244" y="280" width="12" height="180"/>
    <rect x="288" y="280" width="12" height="180"/>
    <rect x="328" y="280" width="12" height="180"/>
  </g>
  <!-- Tangga Balla Lompoa -->
  <polygon points="230,460 270,460 260,330 240,330" fill="#3d050c"/>
  <!-- Siluet Mempelai Berdampingan -->
  <ellipse cx="235" cy="400" rx="14" ry="16" fill="#D4AF37"/>
  <path d="M220 416 L250 416 L255 520 L215 520 Z" fill="#200205"/>
  <ellipse cx="265" cy="405" rx="12" ry="14" fill="#D4AF37"/>
  <path d="M250 419 L280 419 L288 520 L245 520 Z" fill="#7a0914"/>
  <!-- Teks Judul -->
  <rect x="0" y="520" width="500" height="80" fill="rgba(18, 1, 3, 0.9)"/>
  <text x="250" y="555" fill="#FFF2A3" font-family="'Cinzel', serif" font-size="18" text-anchor="middle" font-weight="bold">SAORAJA KELUARGA BESAR</text>
  <text x="250" y="578" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">KEDIAMAN ADAT BUGIS</text>
</svg>
