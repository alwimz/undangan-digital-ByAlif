<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#BF953F" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <radialGradient id="bBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a0a19" />
      <stop offset="100%" stop-color="#240206" />
    </radialGradient>
    <linearGradient id="bodoRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bBgGlow)"/>

  <!-- Ornamen Lingkaran Emas Belakang -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#bGold)" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>

  <!-- Baju Bodo Bahu Mengembang Khas Merah Anggun -->
  <path d="M80 340 C110 270 290 270 320 340 L340 400 L60 400 Z" fill="url(#bodoRedGrad)" stroke="url(#bGold)" stroke-width="2"/>
  
  <!-- Kalung Bersusun Geno Ma'bule Emas -->
  <path d="M165 275 Q200 310 235 275" stroke="url(#bGold)" stroke-width="4.5" fill="none"/>
  <path d="M155 285 Q200 330 245 285" stroke="url(#bGold)" stroke-width="5" fill="none"/>
  <path d="M145 295 Q200 355 255 295" stroke="url(#bGold)" stroke-width="5.5" fill="none"/>
  <circle cx="200" cy="358" r="8" fill="url(#bGold)"/>
  <circle cx="200" cy="358" r="3.5" fill="#800a16"/>

  <!-- Leher & Kepala Mempelai Wanita -->
  <rect x="184" y="225" width="32" height="35" rx="4" fill="#F8CDB0"/>
  <ellipse cx="200" cy="180" rx="42" ry="48" fill="#FDE2D0"/>
  <ellipse cx="200" cy="160" rx="46" ry="36" fill="#1b120c"/>

  <!-- Riasan Cantik: Alis, Bulu Mata, Blush, Lipstik -->
  <path d="M172 168 Q182 162 192 166" stroke="#4a2511" stroke-width="2.5" fill="none"/>
  <path d="M208 166 Q218 162 228 168" stroke="#4a2511" stroke-width="2.5" fill="none"/>
  <path d="M173 176 Q182 182 191 176" stroke="#1b120c" stroke-width="2.5" fill="none"/>
  <path d="M209 176 Q218 182 227 176" stroke="#1b120c" stroke-width="2.5" fill="none"/>
  <circle cx="172" cy="188" r="7" fill="#f87171" opacity="0.4"/>
  <circle cx="228" cy="188" r="7" fill="#f87171" opacity="0.4"/>
  <path d="M190 204 Q200 213 210 204" stroke="#b91c1c" stroke-width="3.5" fill="#b91c1c"/>

  <!-- Mahkota Saloko Emas Bugis-Makassar -->
  <path d="M150 155 C160 105 240 105 250 155 Z" fill="url(#bGold)"/>
  <rect x="146" y="150" width="108" height="10" rx="2" fill="url(#bGold)"/>

  <!-- Kembang Goyang Saloko (Tusuk Konde Bunga Emas) -->
  <line x1="200" y1="115" x2="200" y2="60" stroke="url(#bGold)" stroke-width="3"/>
  <polygon points="200,48 210,60 200,72 190,60" fill="url(#bGold)"/>
  <circle cx="200" cy="60" r="4" fill="#FFEAA7"/>

  <line x1="180" y1="120" x2="162" y2="75" stroke="url(#bGold)" stroke-width="2.5"/>
  <polygon points="162,65 170,75 162,85 154,75" fill="url(#bGold)"/>

  <line x1="220" y1="120" x2="238" y2="75" stroke="url(#bGold)" stroke-width="2.5"/>
  <polygon points="238,65 246,75 238,85 230,75" fill="url(#bGold)"/>

  <!-- Rumbai Ronce Melati Emas -->
  <g stroke="url(#bGold)" stroke-width="1.8" fill="#FFFBEB">
    <circle cx="145" cy="170" r="4"/>
    <circle cx="142" cy="190" r="4.5"/>
    <circle cx="140" cy="212" r="5"/>
    <circle cx="138" cy="235" r="5.5"/>
    <circle cx="255" cy="170" r="4"/>
    <circle cx="258" cy="190" r="4.5"/>
    <circle cx="260" cy="212" r="5"/>
    <circle cx="262" cy="235" r="5.5"/>
  </g>
</svg>
