<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="pacciNight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4a040b" />
      <stop offset="60%" stop-color="#240206" />
      <stop offset="100%" stop-color="#0e0102" />
    </radialGradient>
    <linearGradient id="candleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="500" height="600" fill="url(#pacciNight)"/>

  <!-- Cahaya Lilin Pabbetta Mappacci -->
  <circle cx="250" cy="200" r="130" fill="#fef08a" opacity="0.15"/>
  <circle cx="250" cy="200" r="70" fill="#fef3c7" opacity="0.25"/>

  <!-- Lilin Kembar Adat -->
  <g transform="translate(235, 140)">
    <rect x="0" y="50" width="12" height="110" fill="#fef3c7"/>
    <path d="M6 30 C3 38 1 45 6 50 C11 45 9 38 6 30 Z" fill="url(#candleGlow)"/>
    <circle cx="6" cy="42" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(255, 140)">
    <rect x="0" y="50" width="12" height="110" fill="#fef3c7"/>
    <path d="M6 30 C3 38 1 45 6 50 C11 45 9 38 6 30 Z" fill="url(#candleGlow)"/>
    <circle cx="6" cy="42" r="3" fill="#ffffff"/>
  </g>

  <!-- Bantal Alasa' 7 Lapis Mappacci -->
  <rect x="130" y="320" width="240" height="18" rx="4" fill="#800a16" stroke="#D4AF37" stroke-width="1.5"/>
  <rect x="140" y="305" width="220" height="16" rx="4" fill="#991124" stroke="#D4AF37" stroke-width="1.5"/>
  <rect x="150" y="290" width="200" height="16" rx="4" fill="#5c0612" stroke="#D4AF37" stroke-width="1.5"/>
  <rect x="160" y="275" width="180" height="16" rx="4" fill="#800a16" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- Daun Pacar (Bekka Pacci) -->
  <ellipse cx="250" cy="270" rx="35" ry="12" fill="#15803d"/>
  <circle cx="250" cy="268" r="8" fill="#84cc16"/>

  <!-- Caption -->
  <rect x="0" y="520" width="500" height="80" fill="rgba(14, 1, 2, 0.9)"/>
  <text x="250" y="555" fill="#FFF2A3" font-family="'Cinzel', serif" font-size="18" text-anchor="middle" font-weight="bold">RITUAL SUCI MAPPACCI</text>
  <text x="250" y="578" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">PENSUCIAN HATI & JIWA</text>
</svg>
