<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="emeraldBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0a0507" />
    </radialGradient>
    <linearGradient id="emGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>
  <rect width="500" height="600" fill="url(#emeraldBg)"/>
  <!-- Pola Renda Tenun Bugis -->
  <circle cx="250" cy="260" r="170" fill="none" stroke="url(#emGold)" stroke-width="2" stroke-dasharray="10,6" opacity="0.65"/>
  <circle cx="250" cy="260" r="140" fill="none" stroke="url(#emGold)" stroke-width="1" opacity="0.4"/>

  <!-- Ornamen Floral Sutera Bugis Lagosi -->
  <g transform="translate(250, 260)" stroke="url(#emGold)" stroke-width="2" fill="none">
    <path d="M0 -60 C-30 -20 -30 20 0 60 C30 20 30 -20 0 -60 Z" fill="#047857" opacity="0.4"/>
    <path d="M-60 0 C-20 -30 20 -30 60 0 C20 30 -20 30 -60 0 Z" fill="#047857" opacity="0.4"/>
    <circle cx="0" cy="0" r="18" fill="url(#emGold)"/>
    <circle cx="0" cy="0" r="8" fill="#064e3b"/>
  </g>

  <!-- Caption -->
  <rect x="0" y="520" width="500" height="80" fill="rgba(10, 5, 7, 0.9)"/>
  <text x="250" y="555" fill="#FFF2A3" font-family="'Cinzel', serif" font-size="18" text-anchor="middle" font-weight="bold">NUANSA HIJAU KEBANGSAWANAN</text>
  <text x="250" y="578" fill="#A7F3D0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">KEANGGUNAN BAJU BODO ZAMRUD</text>
</svg>
