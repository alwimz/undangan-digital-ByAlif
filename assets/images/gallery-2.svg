<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34060d" />
      <stop offset="40%" stop-color="#831826" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#580812" />
      <stop offset="100%" stop-color="#180104" />
    </linearGradient>
  </defs>
  <rect width="500" height="420" fill="url(#sunsetGrad)"/>
  <circle cx="250" cy="300" r="90" fill="#fef08a" opacity="0.9"/>
  <!-- Laut Losari -->
  <rect y="400" width="500" height="200" fill="url(#seaGrad)"/>
  <!-- Pantulan Cahaya Matahari di Air -->
  <path d="M210 400 L290 400 L320 520 L180 520 Z" fill="#d97706" opacity="0.35"/>
  <path d="M230 400 L270 400 L285 520 L215 520 Z" fill="#fef08a" opacity="0.4"/>

  <!-- Siluet Kapal Layar Pinisi Khas Bugis Makassar -->
  <g transform="translate(140, 230)">
    <!-- Badan Kapal -->
    <path d="M20 150 Q110 170 200 150 Q230 145 220 175 L10 175 Q-5 155 20 150 Z" fill="#150103"/>
    <!-- Tiang Layar Utama -->
    <line x1="80" y1="150" x2="80" y2="40" stroke="#150103" stroke-width="4"/>
    <line x1="145" y1="150" x2="145" y2="30" stroke="#150103" stroke-width="4"/>
    <!-- Layar Pinisi (7 Layar Khas Sompe') -->
    <path d="M80 50 L20 110 L80 110 Z" fill="#2d0408"/>
    <path d="M80 115 L35 145 L80 145 Z" fill="#2d0408"/>
    <path d="M145 40 L85 105 L145 105 Z" fill="#38050a"/>
    <path d="M145 110 L100 145 L145 145 Z" fill="#38050a"/>
    <path d="M150 50 L195 110 L150 110 Z" fill="#45070e"/>
    <!-- Tali Layar Emas -->
    <line x1="20" y1="150" x2="145" y2="30" stroke="#D4AF37" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Caption -->
  <rect x="0" y="520" width="500" height="80" fill="rgba(18, 1, 3, 0.9)"/>
  <text x="250" y="555" fill="#FFF2A3" font-family="'Cinzel', serif" font-size="18" text-anchor="middle" font-weight="bold">PINISI DAN SENJA MAKASSAR</text>
  <text x="250" y="578" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">SIMBOL KETANGGUHAN & CINTA</text>
</svg>
