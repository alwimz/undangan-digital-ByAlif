<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="silkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c0612" />
      <stop offset="70%" stop-color="#34030a" />
      <stop offset="100%" stop-color="#140103" />
    </radialGradient>
    <linearGradient id="silkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  <rect width="500" height="600" fill="url(#silkBg)"/>
  <!-- Anyaman Kotak Belah Ketupat Sabbe Sengkang -->
  <g stroke="url(#silkGold)" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M250 80 L380 210 L250 340 L120 210 Z"/>
    <path d="M250 110 L350 210 L250 310 L150 210 Z" stroke-dasharray="4,3"/>
    <path d="M250 140 L320 210 L250 280 L180 210 Z"/>
    <!-- Bunga Lagosi Tengah -->
    <circle cx="250" cy="210" r="28" fill="#800a16"/>
    <circle cx="250" cy="210" r="14" fill="url(#silkGold)"/>
  </g>
  <!-- Mini diamond clusters -->
  <circle cx="120" cy="210" r="6" fill="url(#silkGold)"/>
  <circle cx="380" cy="210" r="6" fill="url(#silkGold)"/>
  <circle cx="250" cy="80" r="6" fill="url(#silkGold)"/>
  <circle cx="250" cy="340" r="6" fill="url(#silkGold)"/>
  <path d="M60 400 L440 400" stroke="url(#silkGold)" stroke-width="3"/>
  <path d="M60 410 L440 410" stroke="url(#silkGold)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Caption -->
  <rect x="0" y="520" width="500" height="80" fill="rgba(18, 1, 3, 0.9)"/>
  <text x="250" y="555" fill="#FFF2A3" font-family="'Cinzel', serif" font-size="18" text-anchor="middle" font-weight="bold">TENUN SUTERA SENGKANG</text>
  <text x="250" y="578" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">MOTIF LAGOSI MAHAR KASIH</text>
</svg>
